name: Daily Multi-Board Literature Fetch & Mail

on:
  schedule:
    # GitHub Actions 用 UTC。双时间点冗余, 缓解平台高负载下偶发漏跑/排队延迟:
    #   22:50 UTC = 北京 06:50(主, 中文补录分片就绪后) ; 23:50 UTC = 北京 07:50(兜底)
    # 全流程约 10-15 分钟, 主触发保证 9 点前收到; 兜底触发确保漏跑/超时也能补发
    # 当日幂等由 send_digest.py 保证, 重复触发不会发两封邮件
    - cron: '50 22 * * *'
    - cron: '50 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-lit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-and-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Safeguard restore literature.json if invalid
        run: |
          if ! python3 -c "import json; json.load(open('literature.json'))" 2>/dev/null; then
            echo "literature.json is invalid/missing; restoring from last known-good commit"
            git fetch --no-tags --depth=1 origin 621ee121135991d41859abe35c3fd62b8c4ecee1
            git checkout 621ee121135991d41859abe35c3fd62b8c4ecee1 -- literature.json
          fi

      - name: Fetch global multilingual news (Google News + GDELT)
        # 先跑全球资讯: 生成 manual_inbox/global-YYYY-MM-DD.json 分片,
        # 随后由 fetch_literature.py 现有的 manual_inbox 合并逻辑去重并入主库;
        # 分片为运行时临时文件, 不随仓库提交; 资讯源失败不阻断正式论文采集与邮件
        continue-on-error: true
        run: python3 scripts/fetch_global_news.py --days 2

      - name: Fetch multi-board papers (Europe PMC + PubMed + OpenAlex + Scopus)
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python3 scripts/fetch_literature.py --days 3

      - name: Send daily multi-board digest email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SKIP_IF_EMPTY: '1'
        run: python3 scripts/send_digest.py

      - name: Commit updated literature.json and digest cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add literature.json state/last_digest_date.txt
          if git diff --cached --quiet; then
            echo "无变更, 跳过提交"
          else
            git commit -m "chore: daily multi-board literature update $(date -u +%Y-%m-%d)"
            git push
          fi
