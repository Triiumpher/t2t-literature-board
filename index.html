<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多专题科研文献看板</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--fav:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
  header{background:#111827;color:#fff;padding:20px 28px;}
  header h1{margin:0;font-size:20px;}
  header p{margin:6px 0 0;font-size:13px;color:#9ca3af;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  .toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);}
  .toolbar input{flex:1;min-width:200px;}
  .board-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--ink);}
  .board-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .board-tab.fav-tab.active{background:var(--fav);border-color:var(--fav);}
  .board-tab .cnt{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:12px;}
  .board-tab.fav-tab.active .cnt{background:rgba(255,255,255,.25);}
  .fav-btn{margin-left:auto;background:none;border:none;cursor:pointer;font-size:17px;line-height:1;color:#9ca3af;padding:2px 4px;}
  .fav-btn.active{color:var(--fav);}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 28px 60px;}
  .date-group{margin-bottom:26px;}
  .date-group h2{font-size:15px;color:var(--muted);margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card h3{margin:0 0 8px;font-size:15px;line-height:1.45;}
  .card h3 a{color:var(--ink);text-decoration:none;}
  .card h3 a:hover{color:var(--accent);}
  .meta{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .abstract{font-size:13px;color:#374151;line-height:1.65;margin:8px 0;}
  .takeaway{font-size:13px;color:#92400e;background:#fffbeb;border-left:3px solid #f59e0b;padding:7px 10px;border-radius:4px;margin:8px 0;}
  .species{font-size:12px;color:#065f46;background:#ecfdf5;display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;}
  .chip.type-paper{background:#dcfce7;color:#166534;}
  .chip.type-wechat{background:#ffedd5;color:#9a3412;}
  .chip.type-news{background:#ffe4e6;color:#be123c;}
  .chip.doi{background:#fef3c7;color:#92400e;text-decoration:none;}
  .chip.preprint{background:#ede9fe;color:#6d28d9;}
  .chip.board{color:#fff;}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px;}
  .footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0;}
</style>
</head>
<body>
<header>
  <h1>多专题科研文献看板</h1>
  <p>T2T/端粒到端粒基因组 · 稻纵卷叶螟功能基因组 · 昆虫性别决定 · 蛋白互作预测 · 新型杀虫剂</p>
</header>
<div class="toolbar">
  <span class="board-tab fav-tab" data-board="__fav__">⭐ 我的收藏 <span class="cnt" id="favcnt">0</span></span>
  <span class="board-tab active" data-board="all">全部</span>
  <span class="board-tab" data-board="t2t">T2T 基因组</span>
  <span class="board-tab" data-board="cmed">稻纵卷叶螟</span>
  <span class="board-tab" data-board="sexdet">性别决定</span>
  <span class="board-tab" data-board="ppi">蛋白互作</span>
  <span class="board-tab" data-board="insecticide">杀虫剂</span>
  <input id="kw" type="search" placeholder="搜索标题 / 摘要 / 关键词 / 物种…">
  <select id="type">
    <option value="all">全部类型</option>
    <option value="paper">论文</option>
    <option value="wechat">中文资讯</option>
    <option value="news">全球资讯</option>
  </select>
</div>
<div class="wrap" id="app"></div>
<div class="footer" id="foot"></div>
<script>
const boardNames={t2t:"T2T 基因组",cmed:"稻纵卷叶螟",sexdet:"昆虫性别决定",ppi:"蛋白互作预测",insecticide:"新型杀虫剂"};
const boardColors={t2t:"#2563eb",cmed:"#16a34a",sexdet:"#db2777",ppi:"#9333ea",insecticide:"#ea580c"};
const FAV_KEY='t2t-board-favorites';
let DATA=[], curBoard='all', curKw='', curType='all';
let favorites=new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]'));
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveFav(){localStorage.setItem(FAV_KEY,JSON.stringify([...favorites]));renderFavCount();}
function renderFavCount(){document.getElementById('favcnt').textContent=favorites.size;}
function boardChips(it){return (it.boards||[]).map(b=>`<span class="chip board" style="background:${boardColors[b]||'#6b7280'}">${boardNames[b]||b}</span>`).join('');}
function card(it){
  const fav=favorites.has(it.id);
  const typeLabel=it.type==='paper'?'论文':(it.type==='news'?'全球资讯':'中文资讯');
  const link=it.url||'#';
  return `<div class="card" data-id="${esc(it.id)}">
    <h3><button class="fav-btn ${fav?'active':''}" data-fav="${esc(it.id)}" title="收藏/取消收藏">${fav?'★':'☆'}</button><a href="${esc(link)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
    <div class="meta">${esc(it.publish_date||'')} · ${esc(it.source||'')}${it.authors?' · '+esc(it.authors):''} · ${esc(it.doi||it.pmid||'')}</div>
    ${it.species_latin?`<div class="species">研究物种：${esc(it.species_latin)}${it.species_zh?' / '+esc(it.species_zh):''}</div>`:''}
    ${it.abstract?`<div class="abstract">${esc(it.abstract)}</div>`:''}
    ${it.takeaway?`<div class="takeaway">💡 ${esc(it.takeaway)}</div>`:''}
    <div class="chips">${boardChips(it)}<span class="chip type-${it.type}">${it.type==='paper'?'论文':(it.type==='news'?'全球资讯':'中文资讯')}</span>${it.type==='news'&&it.doi?`<a class="chip doi" href="${esc(it.url)}" target="_blank" rel="noopener" title="已确认的期刊原文 DOI 链接">📄 DOI 原文</a>`:''}${it.link_kind==='preprint'?`<span class="chip preprint" title="预印本，保留原始链接">预印本</span>`:''}</div>
  </div>`;
}
function render(){
  const app=document.getElementById('app');
  let list=DATA.filter(it=>{
    if(curBoard==='__fav__'){ if(!favorites.has(it.id)) return false; }
    else if(curBoard!=='all' && !(it.boards||[]).includes(curBoard)) return false;
    if(curType!=='all' && it.type!==curType) return false;
    if(curKw){const k=curKw.toLowerCase();const hay=[it.title,it.abstract,it.takeaway,it.conclusion,it.species_latin,it.species_en,it.species_zh,(it.keywords||[]).join(' ')].join(' ').toLowerCase();if(!hay.includes(k))return false;}
    return true;
  });
  document.querySelectorAll('.board-tab').forEach(t=>t.classList.toggle('active',t.dataset.board===curBoard));
  document.getElementById('type').value=curType;
  if(!list.length){app.innerHTML='<div class="empty">暂无符合条件的条目。点击卡片右上角 ☆ 可收藏文献。</div>';return;}
  const groups={};
  list.forEach(it=>{const d=it.added_at||it.publish_date||'未知日期';(groups[d]=groups[d]||[]).push(it);});
  app.innerHTML=Object.keys(groups).sort().reverse().map(d=>
    `<div class="date-group"><h2>${d}（${groups[d].length} 条）</h2>${groups[d].map(card).join('')}</div>`
  ).join('');
}
function gotoFav(id){
  curBoard='__fav__';curKw='';curType='all';
  render();
  setTimeout(()=>{const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid #f59e0b';}},50);
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]');
  if(f){const id=f.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);saveFav();render();}
});
document.querySelectorAll('.board-tab').forEach(t=>t.addEventListener('click',()=>{curBoard=t.dataset.board;curKw='';render();}));
document.getElementById('kw').addEventListener('input',e=>{curKw=e.target.value.trim();render();});
document.getElementById('type').addEventListener('change',e=>{curType=e.target.value;render();});
fetch('literature.json').then(r=>r.json()).then(d=>{
  DATA=d.sort((a,b)=>(b.added_at||b.publish_date||'').localeCompare(a.added_at||a.publish_date||''));
  renderFavCount();
  render();
  document.getElementById('foot').textContent=`共 ${DATA.length} 条记录 · 数据更新于 ${DATA[0]?(DATA[0].added_at||''):''} · 收藏仅保存在本机浏览器`;
  const star=new URLSearchParams(location.search).get('star');
  if(star){gotoFav(star);}
}).catch(e=>{document.getElementById('app').innerHTML='<div class="empty">literature.json 加载失败，请确认通过本地 HTTP 服务器打开（见 README）。</div>';});
</script>
</body>
</html>
