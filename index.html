<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>T2T（端粒到端粒）基因组文献看板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:#f1f5f9;color:#0f172a;padding:24px 16px;}
  .wrap{max-width:1080px;margin:0 auto;}
  header h1{font-size:22px;margin-bottom:6px;}
  header .sub{font-size:13px;color:#64748b;margin-bottom:16px;line-height:1.6;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 18px;font-size:13px;color:#475569;}
  .stat b{font-size:20px;color:#0f172a;margin-left:6px;}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  input,select{padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;background:#fff;}
  input[type=text]{flex:1;min-width:220px;}
  .list{display:grid;gap:14px;}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px;}
  .card h3{font-size:16px;line-height:1.5;margin-bottom:8px;}
  .card h3 a{color:#1d4ed8;text-decoration:none;}
  .card h3 a:hover{text-decoration:underline;}
  .meta{font-size:12px;color:#64748b;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;}
  .tag-paper{background:#dbeafe;color:#1e40af;}
  .tag-wechat{background:#fef3c7;color:#92400e;}
  .authors{font-size:12px;color:#64748b;margin-bottom:6px;}
  details{font-size:14px;color:#334155;line-height:1.7;}
  details summary{cursor:pointer;color:#2563eb;font-size:13px;}
  .empty{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:14px;border-radius:8px;font-size:14px;line-height:1.7;}
  footer{margin-top:24px;font-size:12px;color:#94a3b8;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>T2T（Telomere-to-Telomere / 端粒到端粒）基因组文献看板</h1>
    <div class="sub">正式论文由 GitHub Actions 每日从 Europe PMC/PubMed 自动采集；微信公众号与中文资讯每日补录。点击标题跳转原文。</div>
  </header>

  <div class="stats">
    <div class="stat">总条目<b id="stTotal">–</b></div>
    <div class="stat">正式论文<b id="stPaper">–</b></div>
    <div class="stat">微信/中文资讯<b id="stWechat">–</b></div>
    <div class="stat">最近入库<b id="stLatest">–</b></div>
  </div>

  <div class="bar">
    <input type="text" id="kw" placeholder="搜索标题 / 摘要 / 期刊，如 insect、centromere、水稻…">
    <select id="type">
      <option value="all">全部类型</option>
      <option value="paper">仅正式论文</option>
      <option value="wechat">仅微信/中文资讯</option>
    </select>
    <select id="sort">
      <option value="publish_date">按发表日期排序</option>
      <option value="added_at">按入库日期排序</option>
    </select>
  </div>

  <div class="list" id="list"></div>

  <footer>
    数据源：Europe PMC（正式发表，已排除预印本）+ 人工/助手补录的微信中文资讯<br>
    本地预览：在本目录执行 <code>python3 -m http.server 8000</code> 后访问 localhost:8000
  </footer>
</div>

<script>
let DATA = [];
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try{
    const r = await fetch('./literature.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
    render();
  }catch(e){
    $('list').innerHTML = `<div class="empty">加载 literature.json 失败（${esc(String(e))}）。<br>
      直接双击打开 html 时浏览器会禁止读取本地 json，请在项目目录运行
      <code>python3 -m http.server 8000</code>，再访问 http://127.0.0.1:8000/ ；部署到 GitHub Pages 后无此问题。</div>`;
  }
}

function render(){
  const kw = $('kw').value.trim().toLowerCase();
  const type = $('type').value;
  const sortKey = $('sort').value;
  const items = DATA.filter(it=>{
    if(type!=='all' && it.type!==type) return false;
    if(!kw) return true;
    return [it.title,it.abstract,it.source,it.authors].join(' ').toLowerCase().includes(kw);
  }).sort((a,b)=>(b[sortKey]||'').localeCompare(a[sortKey]||''));

  $('stTotal').textContent = DATA.length;
  $('stPaper').textContent = DATA.filter(x=>x.type==='paper').length;
  $('stWechat').textContent = DATA.filter(x=>x.type!=='paper').length;
  $('stLatest').textContent = DATA.map(x=>x.added_at||'').sort().pop()||'–';

  $('list').innerHTML = items.length ? items.map(it=>{
    const isPaper = it.type==='paper';
    const tag = isPaper
      ? '<span class="tag tag-paper">正式论文</span>'
      : '<span class="tag tag-wechat">微信/资讯</span>';
    return `<div class="card">
      <h3><a href="${esc(it.url||'#')}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      <div class="meta">${tag}
        <span>来源：${esc(it.source||'–')}</span>
        <span>发表：${esc(it.publish_date||'–')}</span>
        <span>入库：${esc(it.added_at||'–')}</span>
        ${it.doi?`<span>DOI：${esc(it.doi)}</span>`:''}
      </div>
      ${it.authors?`<div class="authors">${esc(it.authors)}</div>`:''}
      ${it.abstract?`<details><summary>展开摘要</summary><div style="margin-top:6px;">${esc(it.abstract)}</div></details>`:''}
    </div>`;
  }).join('') : '<div class="empty">当前筛选条件下没有匹配条目。</div>';
}

['kw','type','sort'].forEach(id=>{
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});
load();
</script>
</body>
</html>
